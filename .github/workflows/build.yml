name: Build static site
on:
  push:
    branches: [development]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: learning-futures-static-site
          path: dist/
# Deployment to your existing host is intentionally NOT enabled.
# Configure credentials and get approval before adding an SFTP deployment step.
